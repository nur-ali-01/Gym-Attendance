<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1110">
<title>Gym Check-In</title>
<style>
  :root {
    --bg: #0e1110;
    --bg-2: #151a18;
    --card: rgba(255, 255, 255, 0.055);
    --card-border: rgba(255, 255, 255, 0.11);
    --text: #f2f5f3;
    --muted: #97a39d;
    --green: #35e08a;
    --green-deep: #14a85b;
    --danger: #ff7a7a;
    --radius: 22px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(53, 224, 138, 0.16), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(53, 224, 138, 0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 11px;
    background: linear-gradient(145deg, var(--green), var(--green-deep));
    display: grid; place-items: center;
    box-shadow: 0 8px 22px rgba(53, 224, 138, 0.28);
  }
  .brand-mark svg { width: 20px; height: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 30px 24px;
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .screen { display: none; }
  .screen.active { display: block; animation: enter 0.55s var(--ease) both; }

  @keyframes enter {
    from { opacity: 0; transform: translateY(16px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  h1 {
    font-size: clamp(2.1rem, 9vw, 2.7rem);
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h2 {
    font-size: clamp(1.7rem, 7vw, 2.1rem);
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.015em;
    margin-bottom: 8px;
    word-break: break-word;
  }
  .sub { color: var(--muted); font-size: 1.02rem; margin-bottom: 26px; }
  .date { color: var(--green); font-weight: 600; font-size: 0.95rem; margin-bottom: 10px; }

  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }

  input {
    width: 100%;
    font: inherit;
    font-size: 1.05rem; /* 16px+ prevents zoom on mobile */
    color: var(--text);
    background: rgba(0, 0, 0, 0.35);
    border: 1.5px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: #5f6b65; }
  input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(53, 224, 138, 0.16); }
  input.invalid { border-color: var(--danger); }

  .error {
    min-height: 1.3em;
    color: var(--danger);
    font-size: 0.88rem;
    margin-top: 6px;
  }
  .error.banner {
    background: rgba(255, 122, 122, 0.1);
    border: 1px solid rgba(255, 122, 122, 0.3);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 0 0 16px;
    font-size: 0.95rem;
  }
  .error.banner:empty { display: none; }

  .btn {
    width: 100%;
    font: inherit;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
    color: #04120a;
    background: linear-gradient(145deg, var(--green), var(--green-deep));
    border: 0;
    border-radius: 16px;
    padding: 18px 20px;
    cursor: pointer;
    box-shadow: 0 14px 32px rgba(53, 224, 138, 0.3);
    transition: transform 0.15s var(--ease), box-shadow 0.2s, opacity 0.2s, filter 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(0.965); box-shadow: 0 6px 16px rgba(53, 224, 138, 0.25); }
  .btn:disabled { cursor: not-allowed; opacity: 0.75; transform: none; }

  .btn.big {
    padding: 30px 20px;
    font-size: 1.5rem;
    border-radius: 22px;
    margin-top: 6px;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 3px solid rgba(4, 18, 10, 0.25);
    border-top-color: #04120a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .btn.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .link {
    background: none; border: 0; font: inherit;
    color: var(--muted);
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 10px;
    margin: 14px auto 0;
    display: block;
    transition: color 0.2s;
  }
  .link:hover { color: var(--text); }

  .quote {
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    font-style: italic;
    padding: 0 10px;
  }

  /* Success */
  .success { text-align: center; }
  .check-wrap {
    width: 110px; height: 110px;
    margin: 4px auto 22px;
    border-radius: 50%;
    background: rgba(53, 224, 138, 0.12);
    border: 2px solid rgba(53, 224, 138, 0.5);
    display: grid; place-items: center;
    animation: pop 0.6s var(--ease) both, glow 2.4s ease-in-out 0.6s infinite;
  }
  .check-wrap svg { width: 56px; height: 56px; }
  .check-wrap path {
    stroke: var(--green);
    stroke-width: 5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: draw 0.6s 0.35s var(--ease) forwards;
  }
  @keyframes pop  { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(53, 224, 138, 0.35); }
    50%      { box-shadow: 0 0 0 16px rgba(53, 224, 138, 0); }
  }
  .success .line { color: var(--text); font-size: 1.15rem; font-weight: 600; margin-top: 14px; }
  .success .note { color: var(--muted); margin-top: 8px; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  :focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  input:focus-visible { outline: none; }

  @media (min-width: 700px) {
    .card { padding: 40px 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    .check-wrap path { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <main class="app">
    <div class="brand" aria-label="Gym check-in">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04120a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>
        </svg>
      </span>
      <span>Gym Check-In</span>
    </div>

    <section class="card">

      <!-- Registration -->
      <div id="screen-register" class="screen" aria-live="polite">
        <h1>Build your stronger self.</h1>
        <p class="sub">Every workout counts. Show up. Stay consistent. Get stronger.</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" maxlength="60" required>
            <div class="error" id="name-error" role="alert"></div>
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98765 43210" maxlength="20" required>
            <div class="error" id="phone-error" role="alert"></div>
          </div>
          <button type="submit" class="btn">Continue</button>
        </form>
      </div>

      <!-- Check-in -->
      <div id="screen-checkin" class="screen" aria-live="polite">
        <p class="date" id="today"></p>
        <h2 id="welcome">Welcome back 👋</h2>
        <p class="sub">Ready to train?</p>

        <div class="error banner" id="checkin-error" role="alert"></div>

        <button type="button" id="checkin-btn" class="btn big">
          <span class="spinner" aria-hidden="true"></span>
          <span id="checkin-label">CHECK IN</span>
        </button>

        <button type="button" id="switch-btn" class="link">Need to switch member?</button>
      </div>

      <!-- Success -->
      <div id="screen-success" class="screen success" aria-live="polite">
        <div class="check-wrap" aria-hidden="true">
          <svg viewBox="0 0 56 56"><path d="M13 29l10 10 20-22"/></svg>
        </div>
        <h2>Attendance Marked ✓</h2>
        <p class="line" id="success-name">Great work!</p>
        <p class="note">Keep showing up. Your consistency is building your stronger self. 💪</p>
        <p class="note">Another day. Another step stronger.</p>
      </div>

    </section>

    <p class="quote" id="quote"></p>
  </main>

<script>
(function () {
  'use strict';

  var WEBHOOK_URL = 'https://skrana.app.n8n.cloud/webhook/gym-checkin';
  var STORAGE_NAME = 'gym_member_name';
  var STORAGE_PHONE = 'gym_member_phone';
  var REQUEST_TIMEOUT_MS = 20000;

  var QUOTES = [
    'Consistency beats motivation.',
    'Show up. Do the work.',
    'Small steps. Big results.',
    'Your future self will thank you.',
    'Discipline creates results.'
  ];

  var memoryStore = {};
  var isSubmitting = false;

  var $ = function (id) { return document.getElementById(id); };
  var screens = {
    register: $('screen-register'),
    checkin: $('screen-checkin'),
    success: $('screen-success')
  };

  /* ---------- Storage (safe even if localStorage is blocked) ---------- */
  function storeGet(key) {
    try { var v = window.localStorage.getItem(key); return v === null ? (memoryStore[key] || '') : v; }
    catch (e) { return memoryStore[key] || ''; }
  }
  function storeSet(key, value) {
    memoryStore[key] = value;
    try { window.localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }
  function storeRemove(key) {
    delete memoryStore[key];
    try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
  }

  /* ---------- Screens ---------- */
  function showScreen(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].classList.toggle('active', key === name);
    });
  }

  /* ---------- Helpers ---------- */
  function cleanPhone(raw) {
    return String(raw || '').replace(/[\s\-().]/g, '');
  }

  function isValidIndianMobile(cleaned) {
    // Optional +91 / 91 / 0 prefix, then a 10-digit mobile number starting 6-9
    return /^(?:\+91|91|0)?[6-9]\d{9}$/.test(cleaned);
  }

  function formatToday() {
    try {
      return new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) {
      return new Date().toDateString();
    }
  }

  function firstName(name) {
    return String(name || '').trim().split(/\s+/)[0] || '';
  }

  function setFieldError(inputEl, errorEl, message) {
    errorEl.textContent = message || '';
    inputEl.classList.toggle('invalid', !!message);
    if (message) { inputEl.setAttribute('aria-invalid', 'true'); }
    else { inputEl.removeAttribute('aria-invalid'); }
  }

  /* ---------- Render returning user ---------- */
  function showCheckin() {
    var name = storeGet(STORAGE_NAME);
    $('welcome').textContent = 'Welcome back, ' + name + ' 👋';
    $('today').textContent = formatToday();
    $('checkin-error').textContent = '';
    setLoading(false);
    showScreen('checkin');
  }

  function setLoading(loading) {
    var btn = $('checkin-btn');
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
    btn.setAttribute('aria-busy', loading ? 'true' : 'false');
    $('checkin-label').textContent = loading ? 'Checking you in...' : 'CHECK IN';
  }

  /* ---------- Registration ---------- */
  $('register-form').addEventListener('submit', function (event) {
    event.preventDefault();

    var nameInput = $('name');
    var phoneInput = $('phone');
    var name = nameInput.value.replace(/\s+/g, ' ').trim();
    var phone = cleanPhone(phoneInput.value);
    var ok = true;

    if (name.length < 2) {
      setFieldError(nameInput, $('name-error'), 'Please enter your full name.');
      ok = false;
    } else {
      setFieldError(nameInput, $('name-error'), '');
    }

    if (!isValidIndianMobile(phone)) {
      setFieldError(phoneInput, $('phone-error'), 'Enter a valid 10-digit mobile number.');
      ok = false;
    } else {
      setFieldError(phoneInput, $('phone-error'), '');
    }

    if (!ok) {
      (name.length < 2 ? nameInput : phoneInput).focus();
      return;
    }

    storeSet(STORAGE_NAME, name);
    storeSet(STORAGE_PHONE, phone);
    showCheckin();
  });

  $('name').addEventListener('input', function () { setFieldError($('name'), $('name-error'), ''); });
  $('phone').addEventListener('input', function () { setFieldError($('phone'), $('phone-error'), ''); });

  /* ---------- Check-in ---------- */
  function checkIn() {
    if (isSubmitting) { return; }

    var name = storeGet(STORAGE_NAME);
    var phone = storeGet(STORAGE_PHONE);

    if (!name || !phone) {
      showScreen('register');
      return;
    }

    isSubmitting = true;
    setLoading(true);
    $('checkin-error').textContent = '';

    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS) : null;

    var options = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, phone: phone })
    };
    if (controller) { options.signal = controller.signal; }

    fetch(WEBHOOK_URL, options)
      .then(function (response) {
        if (timer) { clearTimeout(timer); }
        if (response.status >= 200 && response.status <= 299) {
          onSuccess(name);
        } else {
          onFailure();
        }
      })
      .catch(function () {
        if (timer) { clearTimeout(timer); }
        onFailure();
      });
  }

  function onSuccess(name) {
    $('success-name').textContent = 'Great work, ' + firstName(name) + '!';
    showScreen('success');
    isSubmitting = false;
  }

  function onFailure() {
    $('checkin-error').textContent = "Couldn't connect. Please try again.";
    setLoading(false);
    isSubmitting = false;
    $('checkin-btn').focus();
  }

  $('checkin-btn').addEventListener('click', checkIn);

  /* ---------- Switch member ---------- */
  $('switch-btn').addEventListener('click', function () {
    if (isSubmitting) { return; }
    storeRemove(STORAGE_NAME);
    storeRemove(STORAGE_PHONE);
    $('register-form').reset();
    setFieldError($('name'), $('name-error'), '');
    setFieldError($('phone'), $('phone-error'), '');
    showScreen('register');
    $('name').focus();
  });

  /* ---------- Init ---------- */
  $('quote').textContent = '\u201C' + QUOTES[Math.floor(Math.random() * QUOTES.length)] + '\u201D';

  if (storeGet(STORAGE_NAME) && storeGet(STORAGE_PHONE)) {
    showCheckin();
  } else {
    showScreen('register');
  }
})();
</script>
</body>
</html>
